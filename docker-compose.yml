services:
  postgres:
    image: postgres:17-alpine
    container_name: layeros_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: layeros_password
      POSTGRES_DB: layer_os
    ports:
      - "5432:5432"
    volumes:
      - layeros_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d layer_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: layeros_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:layeros_password@postgres:5432/layer_os
      SECRET_KEY: layeros-production-super-secret-key-change-in-prod-2026
      ENVIRONMENT: production
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: layeros_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  layeros_pgdata:
