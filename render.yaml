services:
  - type: web
    name: layeros-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: layeros-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://layer-os-orcin.vercel.app,http://localhost:5173"

databases:
  - name: layeros-db
    databaseName: layer_os
    user: postgres
    plan: free

